<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" role="img" aria-label="Ahmed Mohammed — AI/ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#1b1233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="200" fill="url(#bg)"/>
  <rect width="820" height="200" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 40 H820 M0 80 H820 M0 120 H820 M0 160 H820"/>
    <path d="M80 0 V200 M200 0 V200 M320 0 V200 M440 0 V200 M560 0 V200 M680 0 V200"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="200" fill="url(#accent)"/>

  <!-- Name -->
  <text x="40" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="url(#name)">Ahmed Mohammed</text>

  <!-- Title -->
  <text x="42" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#E5E7EB">AI/ML Engineer · Computer Vision · Diffusion / OOD</text>

  <!-- Location + availability -->
  <text x="42" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9CA3AF">📍 Linz, Austria</text>
  <text x="42" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#22D3EE">Open to AI/ML engineer roles — applied research &amp; product</text>

  <!-- Right-side neural-net motif -->
  <g fill="none" stroke="url(#accent)" stroke-width="1.4" opacity="0.85">
    <!-- layer x positions: 600, 670, 740 -->
    <line x1="600" y1="50" x2="670" y2="70"/>
    <line x1="600" y1="50" x2="670" y2="100"/>
    <line x1="600" y1="100" x2="670" y2="70"/>
    <line x1="600" y1="100" x2="670" y2="100"/>
    <line x1="600" y1="100" x2="670" y2="130"/>
    <line x1="600" y1="150" x2="670" y2="130"/>
    <line x1="600" y1="150" x2="670" y2="160"/>
    <line x1="670" y1="70" x2="740" y2="90"/>
    <line x1="670" y1="70" x2="740" y2="120"/>
    <line x1="670" y1="100" x2="740" y2="90"/>
    <line x1="670" y1="100" x2="740" y2="120"/>
    <line x1="670" y1="130" x2="740" y2="120"/>
    <line x1="670" y1="130" x2="740" y2="150"/>
    <line x1="670" y1="160" x2="740" y2="150"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="600" cy="50" r="4"/>
    <circle cx="600" cy="100" r="4"/>
    <circle cx="600" cy="150" r="4"/>
  </g>
  <g fill="#7C3AED">
    <circle cx="670" cy="70" r="4"/>
    <circle cx="670" cy="100" r="4"/>
    <circle cx="670" cy="130" r="4"/>
    <circle cx="670" cy="160" r="4"/>
  </g>
  <g fill="#06B6D4">
    <circle cx="740" cy="90" r="4.5"/>
    <circle cx="740" cy="120" r="4.5"/>
    <circle cx="740" cy="150" r="4.5"/>
  </g>
</svg>

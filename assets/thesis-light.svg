<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Separation loss raised mean AUROC from 92.52% to 99.03% and cut the spread between seeds from 11.07 to 0.07.">
<title>Separation loss raised mean AUROC from 92.52% to 99.03% and cut the spread between seeds from 11.07 to 0.07.</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}</style>
<text x="40" y="32" font-size="24" font-weight="600" fill="#1f2328">Higher accuracy, and far less luck</text>
<text x="40" y="60" font-size="18" fill="#59636e">AUROC on CIFAR-10, mean ± SD over three seeds. Range cut off at 100%.</text>
<line x1="40" x2="40" y1="84" y2="216" stroke="#d1d9e0"/>
<text x="40" y="242" font-size="18" text-anchor="middle" fill="#59636e">70%</text>
<line x1="313.3333333333333" x2="313.3333333333333" y1="84" y2="216" stroke="#d1d9e0"/>
<text x="313.3333333333333" y="242" font-size="18" text-anchor="middle" fill="#59636e">80%</text>
<line x1="586.6666666666666" x2="586.6666666666666" y1="84" y2="216" stroke="#d1d9e0"/>
<text x="586.6666666666666" y="242" font-size="18" text-anchor="middle" fill="#59636e">90%</text>
<line x1="860" x2="860" y1="84" y2="216" stroke="#d1d9e0"/>
<text x="860" y="242" font-size="18" text-anchor="middle" fill="#59636e">100%</text>
<text x="40" y="98" font-size="20" font-weight="600" fill="#1f2328" stroke="#ffffff" stroke-width="8" paint-order="stroke">Baseline: 92.52 ± 11.07%</text>
<line x1="353.0" x2="860.0" y1="112" y2="112" stroke="#818b98" stroke-width="4" stroke-linecap="round"/>
<circle cx="655.5" cy="112" r="8" fill="#818b98" stroke="#ffffff" stroke-width="2"/>
<text x="40" y="172" font-size="20" font-weight="600" fill="#1f2328" stroke="#ffffff" stroke-width="8" paint-order="stroke">With separation loss: 99.03 ± 0.07%</text>
<line x1="831.6" x2="835.4" y1="186" y2="186" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/>
<circle cx="833.5" cy="186" r="8" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
</svg>
